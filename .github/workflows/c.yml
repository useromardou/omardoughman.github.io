# File: .github/workflows/c.yml

name: C Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Build C sources
        run: |
          gcc src/*.c -o c-app
