# File: .github/workflows/cpp.yml

name: C++ Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [g++, clang++]

    steps:
      - uses: actions/checkout@v4

      - name: Install Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Build C++ sources
        run: |
          ${{ matrix.compiler }} src/*.cpp -std=c++17 -o cpp-app
