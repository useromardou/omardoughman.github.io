# File: .github/workflows/dependency-check.yml

name: Dependency Audit

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run dependency review
        uses: actions/dependency-review-action@v4
